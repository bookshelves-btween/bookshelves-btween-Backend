spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookshelves}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# 외부 연동
external:
  # 카카오 도서 API · 소셜 로그인 사용자 정보 조회
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    user-info-uri: https://kapi.kakao.com/v2/user/me
  # LLM API KEY
  gemini:
    api-key: ${GEMINI_API_KEY:}
  # 도서관 정보나루
  data4library:
    auth-key: ${DATA4LIBRARY_AUTH_KEY:}
    base-url: https://data4library.kr/api

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}
  restore-token-expiration-seconds: ${JWT_RESTORE_TOKEN_EXPIRATION_SECONDS:600}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health
