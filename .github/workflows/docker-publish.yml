name: Deploy backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

env:
  AWS_REGION: ap-northeast-2
  REGISTRY: ghcr.io
  IMAGE_NAME: bookshelves-btween/bookshelves-btween-backend

jobs:
  build-push-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy immutable image to EC2 through SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          remote_command="sudo bash -c 'set -Eeuo pipefail
          image_ref=\"$IMAGE_REF\"
          runtime_dir=/opt/bookshelf/runtime
          ghcr_credentials_file=/opt/bookshelf/secrets/ghcr.env
          if [[ -f \"\$ghcr_credentials_file\" ]]; then
            source \"\$ghcr_credentials_file\"
            test -n \"\${GHCR_USER:-}\" && test -n \"\${GHCR_TOKEN:-}\"
            printf %s \"\$GHCR_TOKEN\" | docker login ghcr.io -u \"\$GHCR_USER\" --password-stdin
          fi
          docker pull \"\$image_ref\"
          bundle_container=\$(docker create \"\$image_ref\")
          cleanup() { docker rm -f \"\$bundle_container\" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          install -d -m 755 \"\$runtime_dir\"
          docker cp \"\$bundle_container:/opt/bookshelf-runtime/.\" \"\$runtime_dir/\"
          cleanup
          trap - EXIT
          chmod +x \"\$runtime_dir\"/scripts/*.sh
          exec bash \"\$runtime_dir/scripts/deploy-from-ci.sh\" \"\$image_ref\"'"
          parameters="$(jq -cn --arg command "$remote_command" '{commands: [$command]}')"

          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command ID: $command_id"

          deadline=$((SECONDS + 600))
          while true; do
            command_status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$command_status" in
              Success)
                wait_status=0
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                wait_status=1
                break
                ;;
            esac

            if (( SECONDS >= deadline )); then
              echo "Deployment command did not finish within 600 seconds."
              wait_status=1
              break
            fi

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text

          exit "$wait_status"
